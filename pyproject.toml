[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kopdes"
version = "0.1.0"
description = "Konfigurator OVPN & PPP Dashboard Endpoint System"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "KOPDES Engineering" }
]
dependencies = [
  "PySide6>=6.7",
  "SQLAlchemy>=2.0",
  "PyYAML>=6.0",
  "psutil>=5.9",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[project.scripts]
kopdes = "kopdes.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--strict-markers --disable-warnings"
testpaths = ["tests"]
